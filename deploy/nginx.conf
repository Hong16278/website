server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://license.lucas.dpdns.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /assets/ { try_files $uri =404; expires 7d; add_header Cache-Control "public, max-age=604800"; }
    location /data/ { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
